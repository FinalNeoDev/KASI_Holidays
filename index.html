<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국 공휴일 및 영업일 계산기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; line-height: 1.6; padding: 30px; max-width: 600px; margin: 0 auto; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        .info-box { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 30px; }
        .calc-box { border: 1px solid #ddd; padding: 25px; border-radius: 8px; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="date"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        #resultArea { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 4px; display: none; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px dashed #ccc; padding-bottom: 5px; }
        .result-item:last-child { border-bottom: none; font-size: 1.2em; font-weight: bold; color: #d63384; margin-top: 10px; padding-top: 10px; border-top: 2px solid #ccc; }
        code { color: #d63384; }
    </style>
</head>
<body>

    <h1>📅 공휴일 & 영업일 계산기</h1>
    
    <div class="info-box">
        <p>GitHub Actions 기반 3개년 공휴일 API 연동 중 🟢</p>
        <small>API 엔드포인트: <a href="holidays.json" target="_blank">/holidays.json</a></small>
    </div>

    <div class="calc-box">
        <div class="form-group">
            <label for="startDate">시작일</label>
            <input type="date" id="startDate">
        </div>
        <div class="form-group">
            <label for="endDate">종료일</label>
            <input type="date" id="endDate">
        </div>
        <button onclick="calculateWorkingDays()">실제 영업일 계산하기</button>

        <div id="resultArea">
            <div class="result-item"><span>총 일수:</span> <span id="totalDays">0일</span></div>
            <div class="result-item"><span>주말 (토/일):</span> <span id="weekendDays">0일</span></div>
            <div class="result-item"><span>법정 공휴일 (평일):</span> <span id="holidayDays">0일</span></div>
            <div class="result-item"><span>실제 영업일 (Working Days):</span> <span id="workingDays">0일</span></div>
        </div>
    </div>

    <script>
        let holidayData = [];

        // 1. 페이지 로드 시 holidays.json 데이터를 미리 가져옵니다.
        window.onload = async function() {
            try {
                const response = await fetch('holidays.json');
                const json = await response.json();
                if (json.status === 'success') {
                    // 공휴일 날짜(YYYYMMDD)만 추출하여 배열로 저장
                    holidayData = json.data.map(item => String(item.locdate));
                }
            } catch (error) {
                console.error("공휴일 데이터를 불러오는데 실패했습니다.", error);
            }
            
            // 오늘 날짜를 기본값으로 세팅
            document.getElementById('startDate').valueAsDate = new Date();
        };

        // 2. 날짜를 YYYYMMDD 포맷으로 변환하는 헬퍼 함수
        function getYYYYMMDD(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}${m}${d}`;
        }

        // 3. 영업일 계산 핵심 로직
        function calculateWorkingDays() {
            const startInput = document.getElementById('startDate').value;
            const endInput = document.getElementById('endDate').value;

            if (!startInput || !endInput) {
                alert("시작일과 종료일을 모두 선택해주세요.");
                return;
            }

            let startDate = new Date(startInput);
            let endDate = new Date(endInput);

            if (startDate > endDate) {
                alert("종료일이 시작일보다 빠를 수 없습니다.");
                return;
            }

            let totalDays = 0;
            let weekendDays = 0;
            let holidayDays = 0; // 주말과 겹치지 않는 공휴일 수

            // startDate부터 endDate까지 하루씩 증가시키며 검사
            let currentDate = new Date(startDate);
            
            while (currentDate <= endDate) {
                totalDays++;
                
                const dayOfWeek = currentDate.getDay(); // 0: 일요일, 6: 토요일
                const dateString = getYYYYMMDD(currentDate);
                const isHoliday = holidayData.includes(dateString);

                if (dayOfWeek === 0 || dayOfWeek === 6) {
                    // 주말인 경우
                    weekendDays++;
                } else if (isHoliday) {
                    // 평일인데 공휴일인 경우
                    holidayDays++;
                }

                // 하루 증가
                currentDate.setDate(currentDate.getDate() + 1);
            }

            const workingDays = totalDays - weekendDays - holidayDays;

            // 결과 화면에 출력
            document.getElementById('totalDays').innerText = `${totalDays}일`;
            document.getElementById('weekendDays').innerText = `${weekendDays}일`;
            document.getElementById('holidayDays').innerText = `${holidayDays}일`;
            document.getElementById('workingDays').innerText = `${workingDays}일`;
            document.getElementById('resultArea').style.display = 'block';
        }
    </script>
</body>
</html>
